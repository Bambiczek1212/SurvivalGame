<style>
:root{--bg:#1b1d22;--fg:#f2f2f2;--ac:#5ac05a;--pn:#2b2e36;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);padding:12px;overflow:auto}
.card{background:var(--pn);border:3px solid #555;padding:20px;max-width:460px;width:100%;text-align:center}
h1{margin:0 0 12px;color:var(--ac);font-size:22px}
button,input{font:inherit;padding:10px 14px;margin:4px;border:2px solid #777;background:#3a3e48;color:var(--fg);cursor:pointer}
button:hover{background:var(--ac);color:#000}
input{cursor:text;width:80%}
.av{font-size:28px;padding:6px 10px}.av.sel{background:var(--ac)}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud div{position:absolute;text-shadow:1px 1px 2px #000;font-weight:700}
#cross{left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px}
#hp{left:16px;bottom:16px;font-size:22px}#wp{right:16px;bottom:16px}
#rk{left:16px;top:16px}#msg{left:50%;top:18%;transform:translateX(-50%);color:#ffd84a;font-size:20px}
#flash{position:fixed;inset:0;background:red;opacity:0;pointer-events:none}
#sb{right:12px;top:12px;text-align:right;white-space:pre;font-size:13px;background:rgba(0,0,0,.45);padding:6px 10px;min-width:150px}#tm{left:50%;top:10px;transform:translateX(-50%);font-size:24px}#hb{left:16px;bottom:46px;width:200px;height:14px;background:rgba(0,0,0,.6);border:2px solid #fff;display:none;overflow:hidden}#hbf{left:0;top:0;height:100%;width:100%;background:#44dd44}body.touch #hb{bottom:auto;top:76px;left:250px;width:100px}#hl{left:50%;top:56%;transform:translateX(-50%);width:140px;height:10px;background:rgba(0,0,0,.6);border:2px solid #fff;display:none;overflow:hidden}#hlf{left:0;top:0;height:100%;width:0;background:#e53935}#db{left:50%;top:40px;transform:translateX(-50%);width:200px;height:12px;background:rgba(0,0,0,.6);border:2px solid #7ff;display:none;overflow:hidden}#dbf{left:0;top:0;height:100%;width:100%;background:#4ff}#eye{position:fixed;inset:0;pointer-events:none;z-index:60;display:none;background:rgba(255,170,70,.12);-webkit-backdrop-filter:sepia(.45) brightness(.88);backdrop-filter:sepia(.45) brightness(.88)}
body.eye #eye{display:block}
#eyeT{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:70;background:rgba(0,0,0,.7);color:#fff;padding:6px 12px;border-radius:6px;font:600 14px system-ui;display:none;pointer-events:none}
#ui,#hud,.card,button,input,#eyeT,#emo{font-family:"VT323","Courier New",monospace}
#ui{background-size:auto,64px;background-color:#3a2a1a}
.card{background:rgba(0,0,0,.6);border:4px solid #000;font-size:21px;box-shadow:inset 0 0 0 2px #555}
.card h1{color:#ffd54f;font-size:34px;font-weight:400;text-shadow:3px 3px #3f3f3f;letter-spacing:1px}
.card button,#emo button{background:#8b8b8b;color:#fff;border:2px solid #000;box-shadow:inset -3px -3px 0 #555,inset 3px 3px 0 #c6c6c6;text-shadow:2px 2px #3f3f3f;padding:8px 14px;margin:4px;cursor:pointer;font-size:21px;min-width:170px}
.card button:hover,#emo button:hover{background:#6e7fc9;color:#fff}
.card button:disabled{background:#555;color:#999;cursor:default}
.card input[type=text],.card input:not([type]),.card input[type=number]{background:#111;color:#fff;border:2px solid #aaa;font-size:21px}
.card input[type=range]{width:80%;accent-color:#6e7fc9}
.card .row{margin:8px 0;text-align:left}
#hud div{font-weight:400}
#hp{display:flex;gap:2px}#hp .ht{width:22px;height:22px;image-rendering:pixelated}
#emo{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:20;display:none;flex-direction:column;align-items:center;background:rgba(0,0,0,.6);padding:10px;border:3px solid #000}

#tc{position:fixed;inset:0;z-index:5;pointer-events:none}#tc>*{pointer-events:auto}
#jz{position:absolute;left:0;bottom:0;width:40%;height:62%;touch-action:none}#lz{position:absolute;right:0;top:0;width:55%;height:100%;touch-action:none}
#jr{position:absolute;left:40px;bottom:40px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.4);pointer-events:none!important}
#jn2{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.35)}

#scope::before,#scope::after{content:"";position:absolute;left:50%;top:50%;background:#000;transform:translate(-50%,-50%)}
#scope::before{width:60vmin;height:2px}#scope::after{width:2px;height:60vmin}

let BT=null;
function skinBox(w,h,d,u,v,mat){
 const g=new THREE.BoxGeometry(w*S,h*S,d*S),uv=g.attributes.uv;
 const rc=[[u+d+w,v+d,d,h],[u,v+d,d,h],[u+d,v,w,d],[u+d+w,v,w,d],[u+d,v+d,w,h],[u+d+w+d,v+d,w,h]];
 for(let f=0;f<6;f++){const [x,y,rw,rh]=rc[f];for(let k=0;k<4;k++){const i=f*4+k,a=uv.getX(i),c=uv.getY(i);uv.setXY(i,(x+a*rw)/64,1-(y+rh-c*rh)/64)}}
 return new THREE.Mesh(g,mat);
}
function limb(g,u,v,x,y,sg,mat,parts){
 const pv=new THREE.Group();pv.position.set(x*S,y*S,0);
 const m=skinBox(4,12,4,u,v,mat);m.position.y=-6*S;pv.add(m);g.add(pv);parts.push({m:pv,s:sg});return pv;
}

 const body=skinBox(8,12,4,16,16,mat);body.position.y=18*S;g.add(body);
 const head=skinBox(8,8,8,0,0,mat);head.position.y=28*S;g.add(head);

 const fl=new THREE.Mesh(new THREE.BoxGeometry(.14,.14,.14),new THREE.MeshBasicMaterial({color:0xffdd55}));fl.position.y=-.2;fl.visible=false;gun.add(fl);g.userData.fl=fl;
 const kar=new THREE.Group();kar.position.y=-12*S-.05;
 [[.05,.14,.05,0xbb2222,0,-.07,0,0],[.03,.2,.02,0xd6dde8,0,-.24,0,.3],[.02,.1,.02,0xd6dde8,.07,-.36,0,1]].forEach(p=>{const m=box(p[0],p[1],p[2],p[3]);m.position.set(p[4],p[5],p[6]);m.rotation.z=p[7];kar.add(m)});
 ra.add(kar);g.userData.kar=kar;g.userData.gun=gun;
 const bf=new THREE.Group();bf.position.y=-12*S-.05;[[.04,.2,.05,0xb0b8c0,.03,-.1,0,0],[.04,.2,.05,0xb0b8c0,-.03,-.1,0,.1],[.03,.22,.02,0xd6dde8,0,-.28,0,0]].forEach(p=>{const m=box(p[0],p[1],p[2],p[3]);m.position.set(p[4],p[5],p[6]);m.rotation.z=p[7];bf.add(m)});
 ra.add(bf);g.userData.bf=bf;if(SCON)g.add(makeScooter());
 limb(g,32,48,6,24,-1,mat,parts);

function col(c){return new THREE.MeshLambertMaterial({color:c})}
function addC(x,z,w,d,h,c){const o=typeof c==="object",g=new THREE.BoxGeometry(w,h,d);if(o)scaleUV(g,w,h,d,true);const m=new THREE.Mesh(g,o?c:col(c));m.position.set(x,h/2,z);scene.add(m);solid.push(m);obs.push({x,z,hw:w/2,hd:d/2,h})}
function deco(x,y,z,w,h,d,c,bs){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bs?new THREE.MeshBasicMaterial({color:c}):col(c));m.position.set(x,y+h/2,z);scene.add(m)}
function wallX(z,a,b,gp,h,c){let p=a;for(const g of gp.concat([[b,b]])){if(g[0]>p)addC((p+g[0])/2,z,g[0]-p,.6,h,c);p=g[1]}}
function wallZ(x,a,b,gp,h,c){let p=a;for(const g of gp.concat([[b,b]])){if(g[0]>p)addC(x,(p+g[0])/2,.6,g[0]-p,h,c);p=g[1]}}
function tree(x,z,tc,lc,h){h=h||3;addC(x,z,.7,.7,h,tc);deco(x,h-.6,z,3,2.4,3,lc)}

function makeScooter(){const g=new THREE.Group(),dm=new THREE.MeshLambertMaterial({color:0x2b2b2b}),sm=new THREE.MeshLambertMaterial({color:0xb0b8c0}),bl=new THREE.MeshLambertMaterial({color:0x1565c0});
 const add=(m,x,y,z)=>{m.position.set(x,y,z);g.add(m);return m};
 add(new THREE.Mesh(new THREE.BoxGeometry(.28,.05,.95),bl),0,-.05,0);
 for(const z of [.45,-.42]){const w=add(new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.06,14),dm),0,-.1,z);w.rotation.z=Math.PI/2}
 add(new THREE.Mesh(new THREE.BoxGeometry(.04,.95,.04),sm),0,.4,.5);
 add(new THREE.Mesh(new THREE.BoxGeometry(.56,.04,.04),sm),0,.88,.5);
 return g}

 add(new THREE.Mesh(new THREE.BoxGeometry(.62,.035,.035),sm),0,-.34,-.6);
 for(const x of [-.31,.31])add(new THREE.Mesh(new THREE.BoxGeometry(.09,.045,.045),dm),x,-.34,-.6);
 const st2=add(new THREE.Mesh(new THREE.BoxGeometry(.035,.5,.035),sm),0,-.6,-.62);st2.rotation.x=.25;
 const wh=add(new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.06,14),dm),0,-.88,-.72);wh.rotation.z=Math.PI/2;
 return g}
function bSkate(rn){PADS=[];
 const rm=new THREE.MeshLambertMaterial({color:0xffc107});
 for(const p of [[-18,-12,0],[18,12,Math.PI],[0,-26,Math.PI/2],[0,26,-Math.PI/2],[-24,18,0],[24,-18,Math.PI]]){
  const g=new THREE.Group(),r=new THREE.Mesh(new THREE.BoxGeometry(5,.25,4),rm);r.position.y=.35;r.rotation.x=.22;g.add(r);

 }
